# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.ruff]
src_dirs = ["src", "scripts"]

[processor.pylint]
src_dirs = ["src", "scripts"]

[processor.mypy]
src_dirs = ["src", "scripts"]

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# The Makefile rendered each src/*.ly to out/x.pdf through
# scripts/wrapper_lilypond.py (which runs lilypond, treats warnings as errors,
# cleans partial outputs, and shrinks the pdf). The generator drives
# scripts/lilypond_gen.py, a thin adapter mapping the generator's <in> <out>
# to the wrapper's four-argument call.
[processor.generator.lilypond]
command = "scripts/lilypond_gen.py"
src_dirs = ["src"]
src_extensions = [".ly"]
output_dir = "out"
output_extension = "pdf"
batch = false

# lilypond renders the scores; qpdf linearizes and shrinks the produced pdf.
[dependencies]
system = [
    "lilypond",
    "qpdf",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]
