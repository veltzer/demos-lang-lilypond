# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts"]

[processor.pylint]
src_dirs = ["src", "scripts"]

[processor.mypy]
src_dirs = ["src", "scripts"]

[processor.requirements]
src_dirs = ["src", "scripts"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile rendered each src/*.ly to out/x.pdf through
# scripts/wrapper_lilypond.py (which runs lilypond, treats warnings as errors,
# cleans partial outputs, and shrinks the pdf). The generator drives
# scripts/lilypond_gen.py, a thin adapter mapping the generator's <in> <out>
# to the wrapper's four-argument call.
[processor.generator.lilypond]
command = "scripts/lilypond_gen.py"
src_dirs = ["src"]
src_extensions = [".ly"]
output_dir = "out"
output_extension = "pdf"
batch = false

# lilypond renders the scores; qpdf linearizes and shrinks the produced pdf.
[dependencies]
system = [
    "lilypond",
    "qpdf",
]
